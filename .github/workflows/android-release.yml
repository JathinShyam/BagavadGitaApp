name: ✨ Build & Release APK

on:
  pull_request:
    branches: [main, master, dev]
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  validate-and-build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: 🌐 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📁 Install project dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm cache clean --force
          npm install --legacy-peer-deps || npm install --no-package-lock --legacy-peer-deps
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: ✨ Install EAS CLI
        run: npm install -g eas-cli@latest --legacy-peer-deps

      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: 🖼️ Validate Image Files
        run: |
          failed=0
          for f in ./assets/images/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.png)
                if ! file "$f" | grep -q "PNG image"; then
                  echo "❌ $f: extension is .png but content is not PNG"
                  file "$f"
                  failed=1
                fi
                ;;
              *.jpg|*.jpeg)
                if ! file "$f" | grep -q "JPEG image"; then
                  echo "❌ $f: extension is .jpg/.jpeg but content is not JPEG"
                  file "$f"
                  failed=1
                fi
                ;;
              *.webp)
                if ! file "$f" | grep -qi "Web/P\|WebP"; then
                  echo "❌ $f: extension is .webp but content is not WebP"
                  file "$f"
                  failed=1
                fi
                ;;
              *)
                echo "❌ $f: unsupported image extension (use .png, .jpg, or .webp)"
                failed=1
                ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "Image validation failed"
            exit 1
          fi
          echo "✅ All images valid (content matches extension)"

      - name: 💻 EAS Build - APK (direct install)
        run: |
          echo "⚙ Building APK (release profile) for direct install..."
          eas build --platform android --profile release --non-interactive
        env:
          EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      # AAB / Play Store build disabled — not distributing via Play Store.
      # - name: 💻 EAS Build - AAB (Play Store)
      #   run: |
      #     echo "⚙ Building AAB (production profile) for Play Store..."
      #     eas build --platform android --profile production --non-interactive
      #   env:
      #     EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
      #     EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: 📥 Download APK
        run: |
          mkdir -p ./artifacts
          echo "//registry.npmjs.org/:_authToken=${EAS_ACCESS_TOKEN}" > ~/.npmrc
          echo "//registry.expo.dev/:_authToken=${EAS_ACCESS_TOKEN}" >> ~/.npmrc

          echo "🔍 Fetching latest finished Android build (release/APK)..."
          BUILD_LIST=$(eas build:list --platform android --status finished --limit 1 --json --non-interactive)
          echo "$BUILD_LIST" | jq .

          DOWNLOAD_URL=$(echo "$BUILD_LIST" | jq -r ".[0].artifacts.buildUrl")
          BUILD_ID=$(echo "$BUILD_LIST" | jq -r ".[0].id")
          if [[ -z "$DOWNLOAD_URL" || "$DOWNLOAD_URL" == "null" ]]; then
            echo "❌ No download URL for latest build"
            exit 1
          fi

          echo "📥 Downloading build $BUILD_ID..."
          curl -L "$DOWNLOAD_URL" -o "./artifacts/app.apk"
          echo "✅ Saved app.apk (direct install)"

          if [[ ! -f ./artifacts/app.apk ]]; then
            echo "❌ Missing APK artifact"
            ls -la ./artifacts/
            exit 1
          fi
          echo "✅ Artifact ready"
          ls -la ./artifacts/
        env:
          EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: 🔧 Setup Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git init
          git add .
          git commit -m "chore: prepare for release" || true

      - name: 📃 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Android build
            - **app.apk** – Direct install (sideload)
            - Commit: ${{ github.sha }}
            - Triggered by: ${{ github.actor }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/app.apk
        env:
          GITHUB_TOKEN: ${{ github.token }}
