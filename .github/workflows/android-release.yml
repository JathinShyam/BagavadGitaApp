name: ✨ Build & Release APK + AAB

on:
  pull_request:
    branches: [main, master, dev]
  push:
    tags:
      - "*"

permissions:
  contents: write
  packages: write

jobs:
  validate-and-build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ✅ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: 🌐 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📁 Install project dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm cache clean --force
          npm install --legacy-peer-deps || npm install --no-package-lock --legacy-peer-deps
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: ✨ Install EAS CLI
        run: npm install -g eas-cli@latest --legacy-peer-deps

      - name: Install required tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: 🖼️ Validate Image Files
        run: |
          for f in ./assets/images/*; do
            file "$f" | grep -q "JPEG" && { echo "❌ $f is JPEG, expected PNG"; exit 1; }
          done
          echo "✅ All images valid"

      - name: 💻 EAS Build - APK (direct install)
        run: |
          echo "⚙ Building APK (release profile) for direct install..."
          eas build --platform android --profile release --non-interactive
        env:
          EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: 💻 EAS Build - AAB (Play Store)
        run: |
          echo "⚙ Building AAB (production profile) for Play Store..."
          eas build --platform android --profile production --non-interactive
        env:
          EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: 📥 Download both APK and AAB
        run: |
          mkdir -p ./artifacts
          echo "//registry.npmjs.org/:_authToken=${EAS_ACCESS_TOKEN}" > ~/.npmrc
          echo "//registry.expo.dev/:_authToken=${EAS_ACCESS_TOKEN}" >> ~/.npmrc

          echo "🔍 Fetching latest 2 Android builds (order: [0]=production/AAB, [1]=release/APK)..."
          BUILD_LIST=$(eas build:list --platform android --status finished --limit 2 --json --non-interactive)
          echo "$BUILD_LIST" | jq .

          # [0] = production (AAB) - built last
          # [1] = release (APK) - built first
          for i in 0 1; do
            DOWNLOAD_URL=$(echo "$BUILD_LIST" | jq -r ".[$i].artifacts.buildUrl")
            BUILD_ID=$(echo "$BUILD_LIST" | jq -r ".[$i].id")
            if [[ -z "$DOWNLOAD_URL" || "$DOWNLOAD_URL" == "null" ]]; then
              echo "❌ No download URL at index $i"
              exit 1
            fi
            echo "📥 Downloading build $BUILD_ID..."
            if [[ $i -eq 0 ]]; then
              curl -L "$DOWNLOAD_URL" -o "./artifacts/app.aab"
              echo "✅ Saved app.aab (Play Store)"
            else
              curl -L "$DOWNLOAD_URL" -o "./artifacts/app.apk"
              echo "✅ Saved app.apk (direct install)"
            fi
          done

          if [[ ! -f ./artifacts/app.apk || ! -f ./artifacts/app.aab ]]; then
            echo "❌ Missing artifacts"
            ls -la ./artifacts/
            exit 1
          fi
          echo "✅ Both artifacts ready"
          ls -la ./artifacts/
        env:
          EAS_ACCESS_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EAS_ACCESS_TOKEN }}

      - name: 🔧 Setup Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git init
          git add .
          git commit -m "chore: prepare for release" || true

      - name: 📃 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            ## Android builds
            - **app.apk** – Direct install (sideload)
            - **app.aab** – For Play Store submission
            - Commit: ${{ github.sha }}
            - Triggered by: ${{ github.actor }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/app.apk
            ./artifacts/app.aab
        env:
          GITHUB_TOKEN: ${{ github.token }}
